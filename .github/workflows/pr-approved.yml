name: Call Deploy and Create Subversion Branch
run-name: Jobs Invocation after PR #${{ github.event.pull_request.number }} approval

on:
  pull_request:
    branches:
      - main
      - beta
    types:
      - closed

permissions:
  contents: write
  pull-requests: read
  actions: read

jobs:
  create-release-branch:
    if: >
      github.event.pull_request.merged == true && (
        (github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'beta') ||
        (github.event.pull_request.base.ref == 'beta' && github.event.pull_request.head.ref == 'live')
      )
    runs-on: ubuntu-latest
    environment: practice-environment

    permissions:
      contents: write

    steps:
      - name: Checkout approved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Compute next release branch
        id: version
        run: |
          git fetch --all --prune

          latest=$(git branch -r --list 'origin/release/v*' \
            | sed 's#origin/release/v##' \
            | grep -E '^[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n 1)
          current_branch=${{ github.base_ref }}

          if [ -z "$latest" ]; then
            latest="1.0"
          fi

          major="${latest%%.*}"
          minor="${latest##*.}"
          if [[ "$current_branch" == "beta" ]]; then
            next_minor=$((minor + 1))
            next_branch="release/v${major}.${next_minor}"
          elif [[ "$current_branch" == "main" ]]; then
            next_major=$((major + 1))
            next_branch="release/v${next_major}.0"

          echo "next_branch=${next_branch}" >> "$GITHUB_OUTPUT"

      - name: Create and push release branch
        run: |
          git checkout -b "${{ steps.version.outputs.next_branch }}"
          git push origin "${{ steps.version.outputs.next_branch }}"
          git checkout main
